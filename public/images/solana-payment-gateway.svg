<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <title>Solana Payment Gateway — Portfolio Thumbnail</title>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff06" stroke-width="0.5"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="#0d0d14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Animated glow orb center -->
  <ellipse cx="600" cy="300" rx="320" ry="180" fill="#534AB7" opacity="0">
    <animate attributeName="opacity" values="0.04;0.10;0.04" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="320;370;320" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated glow orb left -->
  <ellipse cx="200" cy="310" rx="140" ry="100" fill="#3C3489" opacity="0">
    <animate attributeName="opacity" values="0.03;0.07;0.03" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated glow orb right -->
  <ellipse cx="1000" cy="310" rx="140" ry="100" fill="#085041" opacity="0">
    <animate attributeName="opacity" values="0.03;0.07;0.03" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ── HEADER ── -->
  <text x="600" y="72" text-anchor="middle" fill="#EEEDFE" font-size="38" font-family="sans-serif" font-weight="700" filter="url(#glowSoft)">Solana Payment Gateway</text>
  <text x="600" y="104" text-anchor="middle" fill="#7F77DD" font-size="18" font-family="sans-serif">Decentralized on-chain payment infrastructure · Web3 · Rust · TypeScript</text>
  <line x1="160" y1="120" x2="1040" y2="120" stroke="#ffffff08" stroke-width="0.5"/>

  <!-- ── CUSTOMER BOX ── -->
  <g filter="url(#glowSoft)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
  </g>
  <rect x="60" y="210" width="200" height="180" rx="16" fill="#0f0a2a" stroke="#534AB7" stroke-width="1.5"/>
  <rect x="60" y="210" width="200" height="48" rx="16" fill="#1e1b3a"/>
  <rect x="60" y="242" width="200" height="16" fill="#1e1b3a"/>
  <text x="160" y="241" text-anchor="middle" fill="#AFA9EC" font-size="15" font-family="sans-serif" font-weight="600">CUSTOMER</text>
  <text x="160" y="278" text-anchor="middle" fill="#7F77DD" font-size="17" font-family="sans-serif">◈ Wallet</text>
  <text x="160" y="302" text-anchor="middle" fill="#534AB7" font-size="13" font-family="sans-serif">Phantom / Backpack</text>
  <text x="160" y="326" text-anchor="middle" fill="#3C3489" font-size="13" font-family="sans-serif">signs tx on-chain</text>
  <text x="160" y="348" text-anchor="middle" fill="#3C3489" font-size="12" font-family="sans-serif">devnet ✓</text>

  <!-- Animated pulse ring on customer -->
  <circle cx="160" cy="300" r="105" fill="none" stroke="#534AB7" stroke-width="1" opacity="0">
    <animate attributeName="r" values="105;125;105" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ── ARROW Customer → Gateway (animated dash) ── -->
  <line x1="262" y1="300" x2="378" y2="300" stroke="#7F77DD" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrPurple)">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="320" y="288" text-anchor="middle" fill="#534AB7" font-size="12" font-family="sans-serif">pay →</text>

  <!-- ── GATEWAY BOX (center) ── -->
  <rect x="380" y="170" width="440" height="260" rx="20" fill="#0d0b22" stroke="#7F77DD" stroke-width="2" filter="url(#glowSoft)"/>
  <rect x="380" y="170" width="440" height="56" rx="20" fill="#1a1040"/>
  <rect x="380" y="208" width="440" height="18" fill="#1a1040"/>
  <text x="600" y="207" text-anchor="middle" fill="#EEEDFE" font-size="16" font-family="sans-serif" font-weight="700">PAYMENT GATEWAY PROGRAM</text>

  <!-- Animated border glow on gateway -->
  <rect x="380" y="170" width="440" height="260" rx="20" fill="none" stroke="#7F77DD" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Checklist items -->
  <text x="410" y="254" fill="#5DCAA5" font-size="15" font-family="sans-serif">✓</text>
  <text x="432" y="254" fill="#c0c8d8" font-size="14" font-family="sans-serif">Register merchant on-chain</text>

  <text x="410" y="282" fill="#5DCAA5" font-size="15" font-family="sans-serif">✓</text>
  <text x="432" y="282" fill="#c0c8d8" font-size="14" font-family="sans-serif">Process &amp; validate payment</text>

  <text x="410" y="310" fill="#5DCAA5" font-size="15" font-family="sans-serif">✓</text>
  <text x="432" y="310" fill="#c0c8d8" font-size="14" font-family="sans-serif">Settle funds to merchant PDA</text>

  <text x="410" y="338" fill="#5DCAA5" font-size="15" font-family="sans-serif">✓</text>
  <text x="432" y="338" fill="#c0c8d8" font-size="14" font-family="sans-serif">Emit events &amp; transaction logs</text>

  <!-- Program ID pill -->
  <rect x="400" y="354" width="360" height="26" rx="8" fill="#0f0a2a"/>
  <text x="580" y="372" text-anchor="middle" fill="#534AB7" font-size="12" font-family="monospace">Program ID: 7xKXtg2ZfB...mBv3Rq</text>

  <!-- Animated scanning line inside gateway -->
  <rect x="382" y="172" width="436" height="2" fill="#7F77DD" opacity="0.4">
    <animate attributeName="y" values="172;426;172" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ── ARROW Gateway → Merchant (animated dash) ── -->
  <line x1="822" y1="300" x2="938" y2="300" stroke="#1D9E75" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrGreen)">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1s" repeatCount="indefinite"/>
  </line>
  <text x="880" y="288" text-anchor="middle" fill="#0F6E56" font-size="12" font-family="sans-serif">settle →</text>

  <!-- ── MERCHANT BOX ── -->
  <rect x="940" y="210" width="200" height="180" rx="16" fill="#041a12" stroke="#1D9E75" stroke-width="1.5"/>
  <rect x="940" y="210" width="200" height="48" rx="16" fill="#082a1c"/>
  <rect x="940" y="242" width="200" height="16" fill="#082a1c"/>
  <text x="1040" y="241" text-anchor="middle" fill="#5DCAA5" font-size="15" font-family="sans-serif" font-weight="600">MERCHANT</text>
  <text x="1040" y="278" text-anchor="middle" fill="#1D9E75" font-size="17" font-family="sans-serif">◈ PDA Account</text>
  <text x="1040" y="302" text-anchor="middle" fill="#0F6E56" font-size="13" font-family="sans-serif">receives SOL</text>
  <text x="1040" y="326" text-anchor="middle" fill="#085041" font-size="13" font-family="sans-serif">auto-settled</text>
  <text x="1040" y="348" text-anchor="middle" fill="#085041" font-size="12" font-family="sans-serif">on-chain ✓</text>

  <!-- Animated pulse ring on merchant -->
  <circle cx="1040" cy="300" r="105" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0">
    <animate attributeName="r" values="105;125;105" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ── NETWORK LAYER ── -->
  <text x="600" y="472" text-anchor="middle" fill="#444441" font-size="13" font-family="sans-serif">— Solana Network Layer —</text>

  <rect x="130" y="486" width="160" height="44" rx="10" fill="#111118" stroke="#2C2C2A" stroke-width="0.5"/>
  <text x="210" y="513" text-anchor="middle" fill="#5F5E5A" font-size="13" font-family="sans-serif">RPC Node</text>

  <rect x="320" y="486" width="160" height="44" rx="10" fill="#111118" stroke="#2C2C2A" stroke-width="0.5"/>
  <text x="400" y="513" text-anchor="middle" fill="#5F5E5A" font-size="13" font-family="sans-serif">Validators</text>

  <rect x="510" y="486" width="180" height="44" rx="10" fill="#111118" stroke="#2C2C2A" stroke-width="0.5"/>
  <text x="600" y="513" text-anchor="middle" fill="#5F5E5A" font-size="13" font-family="sans-serif">Block Storage</text>

  <rect x="720" y="486" width="160" height="44" rx="10" fill="#111118" stroke="#2C2C2A" stroke-width="0.5"/>
  <text x="800" y="513" text-anchor="middle" fill="#5F5E5A" font-size="13" font-family="sans-serif">Sealevel VM</text>

  <!-- Connectors gateway → network -->
  <line x1="490" y1="430" x2="400" y2="484" stroke="#2C2C2A" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="600" y1="430" x2="600" y2="484" stroke="#2C2C2A" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="710" y1="430" x2="800" y2="484" stroke="#2C2C2A" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Animated dots traveling down connectors -->
  <circle cx="490" cy="430" r="3" fill="#7F77DD" opacity="0">
    <animateMotion path="M0,0 L-90,54" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="430" r="3" fill="#7F77DD" opacity="0">
    <animateMotion path="M0,0 L0,54" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ── TECH BADGES ── -->
  <rect x="212" y="572" width="80" height="26" rx="8" fill="#26215C"/>
  <text x="252" y="590" text-anchor="middle" fill="#AFA9EC" font-size="13" font-family="sans-serif">Anchor</text>

  <rect x="304" y="572" width="62" height="26" rx="8" fill="#0C447C"/>
  <text x="335" y="590" text-anchor="middle" fill="#85B7EB" font-size="13" font-family="sans-serif">Rust</text>

  <rect x="378" y="572" width="106" height="26" rx="8" fill="#085041"/>
  <text x="431" y="590" text-anchor="middle" fill="#5DCAA5" font-size="13" font-family="sans-serif">TypeScript</text>

  <rect x="496" y="572" width="90" height="26" rx="8" fill="#0C2340"/>
  <text x="541" y="590" text-anchor="middle" fill="#378ADD" font-size="13" font-family="sans-serif">React.js</text>

  <rect x="598" y="572" width="132" height="26" rx="8" fill="#1a1040"/>
  <text x="664" y="590" text-anchor="middle" fill="#7F77DD" font-size="13" font-family="sans-serif">Wallet Adapter</text>

  <rect x="742" y="572" width="94" height="26" rx="8" fill="#1a1a1a"/>
  <text x="789" y="590" text-anchor="middle" fill="#888780" font-size="13" font-family="sans-serif">Devnet ✓</text>

</svg>
